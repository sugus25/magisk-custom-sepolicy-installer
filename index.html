<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📺 123-HDA Generator — M3U / W3U</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      max-width: 750px;
      margin: 15px auto;
      padding: 0 12px;
      line-height: 1.5;
      background: #121212;
      color: #e0e0e0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 15px;
      font-size: clamp(20px, 5vw, 24px);
      text-align: center;
      word-break: break-word;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #333;
      width: 100%;
    }

    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: 500;
      color: #bbb;
      font-size: clamp(14px, 3vw, 15px);
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: clamp(16px, 4vw, 17px);
      background: #2d2d2d;
      color: #fff;
      transition: border 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .row {
      display: flex;
      gap: 10px;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .row div {
      flex: 1 1 120px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: clamp(16px, 4vw, 17px);
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
      transition: background 0.2s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-direction: column;
    }

    #status {
      margin: 10px 0;
      color: #9ca3af;
      white-space: pre-wrap;
      font-size: clamp(13px, 3vw, 14px);
      word-break: break-word;
      line-height: 1.6;
    }

    pre {
      background: #18181b;
      color: #a1a1aa;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid #27272a;
      margin-top: 10px;
      font-size: clamp(12px, 2.8vw, 13px);
      max-height: 300px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .small {
      font-size: clamp(12px, 2.8vw, 13px);
      color: #888;
      margin-top: 4px;
      word-break: break-word;
      line-height: 1.5;
    }

    .helper-box {
      background: #172554;
      border: 1px solid #1e40af;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: clamp(12px, 2.8vw, 13px);
      color: #93c5fd;
      word-break: break-word;
      line-height: 1.5;
    }

    .helper-box a {
      color: #bfdbfe;
      text-decoration: underline;
      display: inline-block;
      word-break: break-all;
    }

    .tab-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #374151;
      color: #d1d5db;
      font-size: 14px;
      cursor: pointer;
      margin-top: 0;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .source-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
    }

    .source-tab {
      flex: 1;
      padding: 10px 6px;
      border: none;
      border-radius: 6px;
      background: #1f2937;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      margin-top: 0;
    }

    .source-tab.active {
      background: #1e40af;
      color: #fff;
    }

    @media (min-width: 480px) {
      body {
        margin: 30px auto;
        padding: 0 15px;
      }
      h1 {
        text-align: left;
      }
      .btn-group {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <h1>📺 123-HDA — M3U / W3U Generator</h1>

  <!-- เลือกแหล่งที่มา -->
  <div class="source-tabs">
    <button class="source-tab active" data-source="123hda">🎬 123-HDA</button>
    <button class="source-tab" data-source="24hd">📺 24HD</button>
  </div>

  <!-- ส่วน 123-HDA -->
  <div id="source-123hda" class="source-content">
    <div class="helper-box">
      💡 <strong>วิธีใช้:</strong> คัดลอกลิงก์หมวดหมู่จาก <a href="https://www.123-hda.com" target="_blank" rel="noopener noreferrer">123-hda.com</a> เช่น:<br>
      • หน้าแรก: <code>https://www.123-hda.com/</code><br>
      • หมวดหมู่: <code>https://www.123-hda.com/ซีรี่ย์จีน</code>
    </div>
    <div class="card">
      <label>🔗 ลิงก์หน้าหมวดหมู่ / รายการ</label>
      <input type="text" id="catUrl_123hda" value="" placeholder="https://www.123-hda.com/ซีรี่ย์จีน">
      <div class="small">จำกัดสูงสุดไม่เกิน 3 หน้าต่อครั้ง</div>
      <div class="row">
        <div>
          <label>หน้าเริ่ม (1)</label>
          <input type="number" id="start_123hda" value="1" min="1" max="99">
        </div>
        <div>
          <label>หน้าสิ้นสุด (สูงสุด 3)</label>
          <input type="number" id="end_123hda" value="3" min="1" max="99">
        </div>
      </div>
      <button id="btnRun_123hda" onclick="gen_123hda()">🚀 เริ่มสร้างรายการ</button>
    </div>
  </div>

  <!-- ส่วน 24HD -->
  <div id="source-24hd" class="source-content" style="display:none;">
    <div class="helper-box">
      💡 <strong>วิธีใช้:</strong> คัดลอกลิงก์จาก <a href="https://www.24hd.media" target="_blank" rel="noopener noreferrer">24hd.media</a>
    </div>
    <div class="card">
      <label>🔗 URL หมวดหมู่</label>
      <input type="text" id="catUrl_24hd" value="" placeholder="https://www.24hd.media/category/.../">
      <div class="small">จำกัดสูงสุดไม่เกิน 3 หน้าต่อครั้ง</div>
      <div class="row">
        <div>
          <label>หน้าเริ่ม (1)</label>
          <input type="number" id="start_24hd" value="1" min="1" max="99">
        </div>
        <div>
          <label>หน้าสิ้นสุด (สูงสุด 3)</label>
          <input type="number" id="end_24hd" value="3" min="1" max="99">
        </div>
      </div>
      <button id="btnRun_24hd" onclick="gen_24hd()">🚀 เริ่มสร้างรายการ</button>
    </div>
  </div>

  <p id="status"></p>
  <div id="result" style="display:none">
    <div class="tab-group">
      <button class="tab-btn active" data-tab="m3u">📋 M3U</button>
      <button class="tab-btn" data-tab="w3u">📄 W3U</button>
    </div>
    <div class="tab-content active" id="tab-m3u">
      <div class="btn-group">
        <button onclick="copyM3u()" style="background:#059669;">📋 คัดลอก M3U</button>
        <button onclick="downloadM3u()" style="background:#d97706;">📥 ดาวน์โหลด .m3u</button>
      </div>
      <pre id="outM3u"></pre>
    </div>
    <div class="tab-content" id="tab-w3u">
      <div class="btn-group">
        <button onclick="copyW3u()" style="background:#059669;">📋 คัดลอก W3U</button>
        <button onclick="downloadW3u()" style="background:#d97706;">📥 ดาวน์โหลด .w3u</button>
      </div>
      <pre id="outW3u"></pre>
    </div>
  </div>

<script>
// ===== CONFIG =====
const WORKER_123HDA = "https://your-worker-name.you-account.workers.dev/"; // เปลี่ยนเป็นลิงก์ Worker จริง
const WORKER_24HD = "https://ezmovies.samornnovember.workers.dev/";
const SECRET_TOKEN = "ใส่มาทำไม olo";

let currentM3uText = "";
let currentW3uData = null;
let currentSource = "123hda";
let cooldownTimer = null;

// สลับแหล่งที่มา
document.querySelectorAll('.source-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.source-content').forEach(c => c.style.display = 'none');
    tab.classList.add('active');
    currentSource = tab.dataset.source;
    document.getElementById(`source-${currentSource}`).style.display = 'block';
    document.getElementById('result').style.display = 'none';
    document.getElementById('status').textContent = '';
  });
});

// สลับแท็บผลลัพธ์
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// ===== 123-HDA =====
async function gen_123hda() {
  const url = document.getElementById("catUrl_123hda").value.trim();
  const s = parseInt(document.getElementById("start_123hda").value) || 1;
  const e = parseInt(document.getElementById("end_123hda").value) || 1;
  const btn = document.getElementById("btnRun_123hda");

  if (!url.startsWith("https://www.123-hda.com")) {
    statusEl.textContent = "❌ ต้องเป็นลิงก์จาก 123-hda.com เท่านั้น";
    return;
  }
  if ((e - s + 1) > 3) {
    statusEl.textContent = "⚠️ จำกัดไม่เกิน 3 หน้าต่อครั้ง";
    return;
  }
  if (s > e) {
    statusEl.textContent = "❌ หน้าเริ่มต้องน้อยกว่าหรือเท่ากับหน้าสิ้นสุด";
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "⏳ กำลังดึงข้อมูลจาก 123-hda.com...";
  result.style.display = "none";

  try {
    const res = await fetch(`${WORKER_123HDA}?url=${encodeURIComponent(url)}&start=${s}&end=${e}&token=${SECRET_TOKEN}`);
    const txt = await res.text();
    if (!res.ok) throw txt;

    currentM3uText = txt;
    currentW3uData = convertM3uToW3u(txt, url);
    
    outM3u.textContent = currentM3uText;
    outW3u.textContent = JSON.stringify(currentW3uData, null, 2);
    result.style.display = "block";
    statusEl.textContent = "✅ สร้างไฟล์สำเร็จ!";
  } catch (err) {
    statusEl.textContent = "❌ ผิดพลาด: " + err;
  } finally {
    startCooldown(btn);
  }
}

// ===== 24HD =====
async function gen_24hd() {
  const url = document.getElementById("catUrl_24hd").value.trim();
  const s = parseInt(document.getElementById("start_24hd").value) || 1;
  const e = parseInt(document.getElementById("end_24hd").value) || 1;
  const btn = document.getElementById("btnRun_24hd");

  if (!url.startsWith("https://www.24hd.media/")) {
    statusEl.textContent = "❌ ต้องเป็นลิงก์จาก 24hd.media เท่านั้น";
    return;
  }
  if ((e - s + 1) > 3) {
    statusEl.textContent = "⚠️ จำกัดไม่เกิน 3 หน้าต่อครั้ง";
    return;
  }
  if (s > e) {
    statusEl.textContent = "❌ หน้าเริ่มต้องน้อยกว่าหรือเท่ากับหน้าสิ้นสุด";
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "⏳ กำลังดึงข้อมูลจาก 24hd.media...";
  result.style.display = "none";

  try {
    const res = await fetch(`${WORKER_24HD}?url=${encodeURIComponent(url)}&start=${s}&end=${e}&token=${SECRET_TOKEN}`);
    const txt = await res.text();
    if (!res.ok) throw txt;

    currentM3uText = txt;
    currentW3uData = convertM3uToW3u(txt, url);
    
    outM3u.textContent = currentM3uText;
    outW3u.textContent = JSON.stringify(currentW3uData, null, 2);
    result.style.display = "block";
    statusEl.textContent = "✅ สร้างไฟล์สำเร็จ!";
  } catch (err) {
    statusEl.textContent = "❌ ผิดพลาด: " + err;
  } finally {
    startCooldown(btn);
  }
}

// ===== ตัวช่วย =====
function convertM3uToW3u(m3uText, sourceUrl) {
  const segments = sourceUrl.split('/').filter(Boolean);
  const rawName = segments[segments.length - 1] || 'รายการ';
  const catName = decodeURIComponent(rawName);
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit' });
  const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

  const w3u = {
    name: catName,
    author: `อัพเดต ${dateStr} | ${timeStr}`,
    image: "",
    stations: []
  };

  const lines = m3uText.split('\n');
  let current = null;

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    if (line.startsWith('#EXTINF:')) {
      const nameMatch = line.match(/#EXTINF:.*?,\s*(.*)$/);
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      if (nameMatch) {
        current = {
          name: nameMatch[1].trim(),
          image: logoMatch ? logoMatch[1].trim() : "",
          category: groupMatch ? groupMatch[1].trim() : "ทั่วไป",
          url: "",
          referer: "",
          info: ""
        };
      }
    } else if (line.startsWith('http') && current) {
      let url = line;
      let referer = "";
      const refMatch = url.match(/\|\s*referer=(https?:\/\/[^\s]+)/);
      if (refMatch) {
        referer = refMatch[1];
        url = url.replace(/\s*\|\s*referer=.*/, '');
      }
      current.url = url;
      current.referer = referer || (sourceUrl.includes("123-hda") ? "https://www.123-hda.com" : "https://www.24hd.media");
      w3u.stations.push(current);
      current = null;
    }
  }

  return w3u;
}

function startCooldown(btn) {
  btn.textContent = "⏳ กรุณารอ (5s)";
  let countdown = 5;
  clearInterval(cooldownTimer);
  cooldownTimer = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      btn.textContent = `⏳ กรุณารอ (${countdown}s)`;
    } else {
      clearInterval(cooldownTimer);
      btn.disabled = false;
      btn.textContent = "🚀 เริ่มสร้างรายการ";
    }
  }, 1000);
}

function getFilename() {
  const url = document.getElementById(`catUrl_${currentSource}`).value.trim();
  const segments = url.split('/').filter(Boolean);
  const name = decodeURIComponent(segments[segments.length - 1] || 'playlist');
  return `${currentSource}_${name}`;
}

// คัดลอก
function copyM3u() {
  navigator.clipboard.writeText(currentM3uText);
  alert("✅ คัดลอก M3U เรียบร้อย");
}
function copyW3u() {
  navigator.clipboard.writeText(outW3u.textContent);
  alert("✅ คัดลอก W3U เรียบร้อย");
}

// ดาวน์โหลด
function downloadM3u() {
  const blob = new Blob([currentM3uText], { type: 'application/vnd.apple.mpegurl;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = getFilename() + '.m3u';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadW3u() {
  const blob = new Blob([outW3u.textContent], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = getFilename() + '.w3u';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// อ้างอิง
const statusEl = document.getElementById('status');
const result = document.getElementById('result');
const outM3u = document.getElementById('outM3u');
const outW3u = document.getElementById('outW3u');
</script>
</body>
</html>
